name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run api:check
      - run: npm run pilot:check
      - run: npm run test:db
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start isolated local Supabase
        run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/menuflow-supabase.log" 2>&1
      - run: npm run test:integration
      - run: npx supabase db advisors --local --type all --level warn --fail-on error
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
